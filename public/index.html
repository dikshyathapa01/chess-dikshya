<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Redirect</title>
</head>
<body>
    <script>
        (function () {
            try {
                const raw = localStorage.getItem('chessAuth');
                const session = raw ? JSON.parse(raw) : null;
                const isLoggedIn = !!(session && session.token && session.user);
                window.location.replace(isLoggedIn ? '/game.html' : '/login.html');
            } catch {
                localStorage.removeItem('chessAuth');
                window.location.replace('/login.html');
            }
        })();
    </script>
</body>
</html>
