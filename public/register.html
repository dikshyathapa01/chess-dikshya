<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Chess</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1 class="game-title">Chess<span class="dot">.</span></h1>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Sign up and start playing instantly.</p>

        <form id="registerForm" class="auth-form">
            <input id="registerName" type="text" placeholder="Name" required>
            <input id="registerEmail" type="email" placeholder="Email" required>
            <input id="registerPassword" type="password" placeholder="Password" required>
            <button type="submit" class="btn primary-btn">Create Account</button>
        </form>

        <p id="authMessage" class="auth-message"></p>
        <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
    </main>

    <script src="auth.js"></script>
</body>
</html>
